<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayesha Boutique - Collection</title>
    <style>
        :root {
            --primary-color: #4a1525;
            --accent-color: #d4af37;
            --bg-color: #fcfbfa;
            --text-color: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
        }
        .admin-panel {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #d4af37;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .admin-panel h3 {
            margin-top: 0;
            color: var(--primary-color);
        }
        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group input, .form-group textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-add {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-add:hover {
            background-color: #b8972f;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }
        .product-card {
            background: #ffffff;
            border: 1px solid #e0dcd5;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            background-color: #f0efed;
        }
        .product-info {
            padding: 20px;
        }
        .brand-name {
            font-size: 14px;
            color: var(--accent-color);
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .product-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-color);
            margin: 0 0 10px 0;
        }
        .product-code {
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
        }
        .product-details {
            font-size: 13px;
            color: #555;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .product-price {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 15px;
        }
        .btn-order {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: var(--primary-color);
            color: #ffffff;
            text-align: center;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-order:hover {
            background-color: #380f1b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Ayesha Boutique - Exclusive Collection</h1>
    
    <!-- Admin Quick Form to Add Unlimited Suits easily -->
    <div class="admin-panel">
        <h3>Naya Suit Add Karein (Instant Preview)</h3>
        <div class="form-group">
            <input type="text" id="brandInput" placeholder="Brand Name ( Jaise: Maria B )">
            <input type="text" id="titleInput" placeholder="Title ( Jaise: 3 Piece Suit )">
            <input type="text" id="codeInput" placeholder="Code ( Jaise: SI-F-124 )">
            <input type="text" id="priceInput" placeholder="Price ( Jaise: 4,000 Rs )">
        </div>
        <div class="form-group">
            <input type="text" id="imgInput" placeholder="Image Link ya File Name ( Jaise: extracted_pypdf_1_0.png )" style="grid-column: span 2;">
            <textarea id="descInput" placeholder="Details ( Jaise: Premium Embroidered Lawn Shirt... )" style="grid-column: span 2; height: 40px;"></textarea>
        </div>
        <button class="btn-add" onclick="addNewProduct()">Suit Store Par Publish Karein</button>
    </div>

    <div class="product-grid" id="productGrid">
        <!-- Products dynamically load honge -->
    </div>
</div>

<script>
    // Shuruwat ke kuch suits jo pehle se hain
    let products = [
        { brand: "Maria B", title: "3 Piece Summer Suit", code: "SI-F-124", price: "4,000 Rs", img: "extracted_pypdf_1_0.png", desc: "Premium Embroidered Lawn Shirt, Premium Printed Dupatta, Premium Dyed Trouser." },
        { brand: "Lulusar", title: "3 Piece Digital Suit", code: "SI-D-5017", price: "4,000 Rs", img: "extracted_pypdf_2_0.png", desc: "Premium Digital Printed Lawn Shirt, Premium Digital Printed Dupatta, Premium Dyed Trouser." },
        { brand: "Farasha", title: "3 Piece Embroidered Suit", code: "SI-F-42", price: "4,000 Rs", img: "extracted_pypdf_3_0.png", desc: "Premium Embroidered Lawn Shirt, Premium Printed Dupatta, Premium Dyed Trouser." }
    ];

    function renderProducts() {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = "";
        products.forEach(p => {
            let card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${p.img}" alt="${p.brand}" class="product-img" onerror="this.src='https://via.placeholder.com/280x380?text=Ayesha+Boutique'">
                <div class="product-info">
                    <div class="brand-name">${p.brand}</div>
                    <h3 class="product-title">${p.title}</h3>
                    <div class="product-code">Code: ${p.code}</div>
                    <div class="product-details">${p.desc}</div>
                    <div class="product-price">${p.price}</div>
                    <a href="https://wa.me/923208712508?text=I%20want%20to%20order%20${encodeURIComponent(p.brand)}%20Code:%20${encodeURIComponent(p.code)}" target="_blank" class="btn-order">Order Now</a>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function addNewProduct() {
        let brand = document.getElementById('brandInput').value;
        let title = document.getElementById('titleInput').value;
        let code = document.getElementById('codeInput').value;
        let price = document.getElementById('priceInput').value;
        let img = document.getElementById('imgInput').value;
        let desc = document.getElementById('descInput').value;

        if(!brand || !code) {
            alert("Kam az kam Brand aur Code lazmi likhein!");
            return;
        }

        products.unshift({
            brand: brand,
            title: title || "Exclusive Suit",
            code: code,
            price: price || "3,000 Rs",
            img: img || "extracted_pypdf_1_0.png",
            desc: desc || "Premium fabric with beautiful design."
        });

        renderProducts();

        // Form clear karna
        document.getElementById('brandInput').value = '';
        document.getElementById('titleInput').value = '';
        document.getElementById('codeInput').value = '';
        document.getElementById('priceInput').value = '';
        document.getElementById('imgInput').value = '';
        document.getElementById('descInput').value = '';
        
        alert("Naya suit list mein add ho gaya hai!");
    }

    renderProducts();
</script>

</body>
</html>
